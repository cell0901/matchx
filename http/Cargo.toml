[package]
name = "rust-cex"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
jsonwebtoken = "9.3"
tokio = { version = "1", features = ["full"] }
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0"
dotenvy = "0.15" #.env
# db orm
sea-orm = { version = "2.0.0", features = [ "sqlx-postgres", "runtime-tokio-native-tls", "macros" ] }
redis = { version = "1.0.4", features = ["tokio-comp"] }
uuid = { version = "1.14", features = ["v7", "serde"] }
futures-util = "0.3.34"
# strgin to u64 parsing
rust_decimal = "1.34" # or current version
strum = {version = "0.28.0",features = ["derive"]}
reqwest = { version = "0.12", features = ["json"] }
