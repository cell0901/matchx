[package]
name = "ws"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-ws = "0.4.0"
actix-web = "4"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
redis = { version = "1.0.4", features = ["tokio-comp"] }
uuid = { version = "1.14", features = ["v7", "serde"] }
dotenvy = "0.15" #.env
futures-util = "0.3.34"
