[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "1.0.4", features = ["tokio-comp"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.14", features = ["v7", "serde"] }
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0"
rustc-hash = "2.1.3"
crossbeam-channel = "0.5.17"
